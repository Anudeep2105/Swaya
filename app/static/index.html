<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swaya</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f7fa;color:#172033}
button{border:0;border-radius:8px;padding:10px 16px;background:#2563eb;color:white;font-weight:600;cursor:pointer}
button:hover{opacity:.9}
button.secondary{background:white;color:#344054;border:1px solid #d0d5dd}
button.danger{background:#dc2626}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px;margin:6px 0 14px;font:inherit}
textarea{resize:vertical}
label{font-weight:600;display:block;margin-top:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px;border-bottom:1px solid #eaecf0;vertical-align:top}
th{background:#f9fafb}
.card{background:white;border:1px solid #eaecf0;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.muted{color:#667085}
.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#eef4ff;color:#175cd3;font-size:12px;font-weight:600}
.success{color:#067647}
.error{color:#b42318}
.warning{color:#b54708}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#101828;color:white;padding:20px;position:fixed;left:0;top:0;bottom:0;overflow:auto}
.sidebar h2{margin-top:0}
.sidebar button{display:block;width:100%;text-align:left;background:transparent;margin:5px 0}
.sidebar button:hover{background:#1d2939}
.main{margin-left:250px;width:calc(100% - 250px)}
.topbar{background:white;border-bottom:1px solid #eaecf0;padding:15px 24px;display:flex;justify-content:space-between;align-items:center}
.content{padding:24px;max-width:1400px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.stat{font-size:28px;font-weight:700}
.lesson{cursor:pointer;transition:.15s}
.lesson:hover{transform:translateY(-2px)}
.lesson.locked{opacity:.65}
.lesson.done{border-left:5px solid #12b76a}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:420px;max-width:100%;background:white;padding:32px;border-radius:16px;border:1px solid #eaecf0}
.nav-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
pre{background:#101828;color:#f8fafc;padding:15px;border-radius:8px;overflow:auto}
code{font-family:Consolas,monospace}
.question{border:1px solid #eaecf0;border-radius:10px;padding:18px;margin-bottom:15px}
.option{display:block;padding:8px;margin:5px 0}
.public-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px max(20px,calc((100% - 1200px)/2));background:#101828;color:#fff}
.public-nav strong{font-size:21px}.public-nav .nav-row{margin:0}
.public-wrap{max-width:1200px;margin:auto;padding:32px 20px 64px}
.hero{padding:56px 42px;border-radius:22px;background:linear-gradient(125deg,#112b4e,#2563eb);color:white;margin:12px 0 32px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.08;max-width:800px;margin:0 0 18px}
.hero p{font-size:18px;line-height:1.6;max-width:730px;color:#e0eaff}
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.public-nav button{margin:0}
.course-choice-list{display:grid;gap:10px;margin:10px 0 18px}
.course-choice{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #d0d5dd;border-radius:9px;cursor:pointer}
.course-choice input{width:auto;flex:0 0 auto;margin:3px 0 0}
.course-choice span{display:block}
.construction-notice{padding:13px 18px;background:#fffaeb;border:1px solid #fedf89;border-radius:10px;color:#93370d;margin:14px 0 22px}
.sheet-wrap{overflow:auto;border:1px solid #d0d5dd;border-radius:10px;background:#fff}.sheet{border-collapse:separate;border-spacing:0;min-width:760px}.sheet th,.sheet td{padding:0;border-right:1px solid #eaecf0;border-bottom:1px solid #eaecf0}.sheet th{height:32px;text-align:center;color:#475467}.sheet .row-head{width:44px;min-width:44px;text-align:center;background:#f9fafb}.sheet-cell{width:100%;min-width:96px;height:36px;border:0!important;border-radius:0!important;margin:0!important;padding:7px 9px!important;background:transparent}.sheet-cell:focus{outline:2px solid #2563eb;outline-offset:-2px;position:relative}.sheet-toolbar{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin:12px 0}.sheet-toolbar input{margin:0;font-family:Consolas,monospace}
.sql-editor{min-height:145px;font:15px/1.5 Consolas,monospace;background:#101828;color:#f8fafc}.sql-result{overflow:auto}.sql-result table{min-width:420px}.sql-result th,.sql-result td{white-space:nowrap}
@media(max-width:800px){
 .sidebar{position:static;width:100%;height:auto}
 .app{display:block}
 .main{margin-left:0;width:100%}
 .public-nav{align-items:flex-start;flex-direction:column}.hero{padding:36px 24px}
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const API='/api';
let currentUser=null;
let courseLessons=[];
let currentLesson=null;
let currentCourseId=null;
let quizQuestions=[];
let historyStack=[];
let pythonExercises=[];
let pythonIndex=0;
let adminMfaSetupToken='';
let questionBankItems=[];
let questionTargets=[];

function $(s){return document.querySelector(s)}
function esc(v){
  return String(v??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function formatApiError(data,status){
  const detail=data?.detail;
  if(typeof detail==='string')return detail;
  if(Array.isArray(detail))return detail.map(issue=>{
    const field=(issue?.loc||[]).filter(part=>part!=='body').pop()||'Request';
    const label=String(field).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
    if(issue?.type==='missing')return `${label} is required.`;
    if(field==='email'&&String(issue?.type||'').includes('email'))return 'Enter a valid email address.';
    if(issue?.type==='string_too_short')return `${label} must be at least ${issue?.ctx?.min_length||'the required number of'} characters.`;
    return `${label}: ${issue?.msg||'is invalid.'}`;
  }).join(' ');
  if(detail&&typeof detail==='object')return detail?.errors?.join(' ')||detail?.message||'The request could not be completed.';
  return data?.message||('Request failed: '+status);
}

async function api(path,opts={}){
  const headers=opts.headers||{};
  if(!(opts.body instanceof FormData)) headers['Content-Type']='application/json';

  const token=localStorage.getItem('token');
  if(token) headers.Authorization='Bearer '+token;

  const r=await fetch(API+path,{...opts,headers});

  let data=null;
  try{data=await r.json()}catch{}

  if(!r.ok){
    throw new Error(formatApiError(data,r.status));
  }

  return data;
}

function setView(html){$('#view').innerHTML=html}
function pushPage(fn){
  if(historyStack[historyStack.length-1]!==fn) historyStack.push(fn);
}
function goBack(){
  if(historyStack.length>1){
    historyStack.pop();
    const fn=historyStack[historyStack.length-1];
    if(typeof fn==='function') fn();
  }else dashboard();
}

function backButton(){
  return '<button class="secondary" onclick="goBack()">&#8592; Back</button>';
}

function logout(){
  localStorage.removeItem('token');
  currentUser=null;
  historyStack=[];
  loginPage();
}

async function start(){
  const token=localStorage.getItem('token');

  if(!token){
    publicHome();
    return;
  }

  try{
    currentUser=await api('/me');
    dashboard();
  }catch(e){
    localStorage.removeItem('token');
    loginPage();
  }
}

function loginPage(){
  $('#app').innerHTML=`
    <div class="login-wrap">
      <div class="login-box">
        <button class="secondary" onclick="publicHome()">&#8592; Home</button>
        <h1 style="margin-top:22px">Sign in to Swaya</h1>
        <p class="muted">Your self-directed learning platform</p>

        <form onsubmit="login(event)">
          <label>Email</label>
          <input id="loginEmail" type="email" autocomplete="username" required>

          <label>Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>

          <label id="mfaCodeLabel" class="hidden">Authenticator code</label>
          <input id="mfaCode" class="hidden" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code">

          <button style="width:100%">Sign in</button>
        </form>

        <div id="loginMsg" style="margin-top:15px"></div>

        <hr style="margin:25px 0;border:0;border-top:1px solid #eaecf0">

        <button class="secondary" style="width:100%" onclick="registerPage()">
          Create learner account
        </button>
      </div>
    </div>`;
}

async function publicHome(){
  pushPage(publicHome);
  let courses=[];
  try{courses=await api('/public/courses');}catch(e){}
  $('#app').innerHTML=`
    <nav class="public-nav"><strong>Swaya</strong><div class="nav-row">
      <button class="secondary" onclick="publicHome()">Home</button>
      <button class="secondary" onclick="aboutPage()">About</button>
      <button class="secondary" onclick="feedbackPage()">Feedback</button>
      <button class="secondary" onclick="requestPage()">Contribute or request access</button>
      <button onclick="loginPage()">Learner / Admin sign in</button>
    </div></nav>
    <main class="public-wrap">
      <div class="construction-notice" role="status"><strong>Swaya is under construction.</strong> We’re continuing to improve the website. Please excuse any inconvenience, and <button class="secondary" onclick="feedbackPage()">share feedback</button> if you run into an issue.</div>
      <section class="hero"><span class="pill">Learn at your pace. Shape your path.</span>
        <h1>Learning pathways for what you want to become.</h1>
        <p>Swaya helps learners build practical skills through clear, day-wise courses, hands-on practice, and steady progress.</p>
        <button onclick="requestPage('learner_access')">Request learner access</button>
        <button class="secondary" onclick="requestPage('contributor')">Become a contributor</button>
      </section>
      <section><h2>Published courses</h2><p class="muted">Explore the learning paths currently available on Swaya.</p>
        ${courses.length?`<div class="course-grid">${courses.map(c=>`<article class="card"><span class="pill">${esc(c.course_code||'Learning path')}</span><h3>${esc(c.title)}</h3><p>${esc(c.description||'A structured learning path with practical lessons.')}</p><p class="muted">${esc(c.lesson_count)} day-wise lessons</p><button onclick="requestPage('learner_access',${c.id})">Request access</button></article>`).join('')}</div>`:'<div class="card"><p>Published course information will appear here.</p></div>'}
      </section>
      <section class="card" style="margin-top:28px"><h2>Build learning with us</h2><p>We welcome contributors, subject experts, and content developers who want to make practical learning more accessible.</p><button onclick="requestPage('contributor')">Share your interest</button> <button class="secondary" onclick="requestPage('content_developer')">Create learning content</button></section>
    </main>`;
}

function feedbackPage(){
  pushPage(feedbackPage);
  $('#app').innerHTML=`<nav class="public-nav"><strong>Swaya</strong><div class="nav-row"><button class="secondary" onclick="publicHome()">Home</button><button onclick="loginPage()">Sign in</button></div></nav>
    <main class="public-wrap"><div class="nav-row"><button class="secondary" onclick="publicHome()">&#8592; Home</button></div>
    <section class="card" style="max-width:760px;margin:20px auto"><h1>Send feedback</h1><p class="muted">Tell us what happened. You can attach an optional screenshot to help us understand the issue. Screenshots are limited to 5 MB (PNG, JPG, or WEBP).</p>
      <form onsubmit="submitFeedback(event)">
        <label>Your name</label><input id="feedbackName" required minlength="2" maxlength="120" autocomplete="name">
        <label>Email address</label><input id="feedbackEmail" type="email" required maxlength="255" autocomplete="email">
        <label>What happened?</label><textarea id="feedbackMessage" rows="5" required minlength="5" maxlength="3000" placeholder="Describe what you were doing and what went wrong."></textarea>
        <label>Screenshot (optional)</label><input id="feedbackScreenshot" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp">
        <button id="feedbackSubmit">Send feedback</button><div id="feedbackMsg" style="margin-top:12px" aria-live="polite"></div>
      </form>
    </section></main>`;
}

async function submitFeedback(event){
  event.preventDefault();
  const msg=$('#feedbackMsg'),file=$('#feedbackScreenshot').files[0];
  if(file&&file.size>5*1024*1024){msg.className='error';msg.textContent='Screenshot must be 5 MB or smaller.';return;}
  const form=new FormData();form.append('name',$('#feedbackName').value);form.append('email',$('#feedbackEmail').value);form.append('message',$('#feedbackMessage').value);if(file)form.append('screenshot',file);
  msg.className='muted';msg.textContent='Sending…';$('#feedbackSubmit').disabled=true;
  try{const data=await api('/public/feedback',{method:'POST',body:form});msg.className='success';msg.textContent=data.message;event.target.reset();}
  catch(e){msg.className='error';msg.textContent=e.message;}
  finally{$('#feedbackSubmit').disabled=false;}
}

function aboutPage(){
  pushPage(aboutPage);
  $('#app').innerHTML=`<nav class="public-nav"><strong>Swaya</strong><div class="nav-row"><button class="secondary" onclick="publicHome()">Home</button><button onclick="loginPage()">Sign in</button></div></nav>
    <main class="public-wrap"><div class="nav-row"><button class="secondary" onclick="publicHome()">&#8592; Home</button></div>
    <section class="hero"><h1>Learning should move you toward the future you choose.</h1><p>Swaya is a self-directed learning platform built to help people grow practical skills through approachable, structured learning.</p></section>
    <div class="card"><h2>Our purpose</h2><p>We make learning pathways easier to follow and easier to create. Learners can move through day-wise lessons, practice what they learn, and track progress at their own pace.</p><p>Swaya also invites educators, contributors, and content developers to share their knowledge and build useful resources with the learning community.</p><button onclick="requestPage('contributor')">Get involved</button></div></main>`;
}

async function requestPage(requestType='contributor',courseId=null){
  pushPage(()=>requestPage(requestType,courseId));
  let courses=[];
  try{courses=await api('/public/courses');}catch(e){}
  const options=courses.map(c=>`<option value="${c.id}" ${Number(courseId)===Number(c.id)?'selected':''}>${esc(c.title)}</option>`).join('');
  $('#app').innerHTML=`<nav class="public-nav"><strong>Swaya</strong><div class="nav-row"><button class="secondary" onclick="publicHome()">Home</button><button onclick="loginPage()">Sign in</button></div></nav>
    <main class="public-wrap"><div class="nav-row"><button class="secondary" onclick="publicHome()">&#8592; Home</button></div>
    <section class="card" style="max-width:760px;margin:20px auto"><h1>Connect with Swaya</h1><p class="muted">Tell us how you would like to take part. Your request will be sent to the Swaya administrator.</p>
      <form onsubmit="submitPublicRequest(event)">
        <label>Your name</label><input id="publicRequestName" required minlength="2" maxlength="120" autocomplete="name">
        <label>Email address</label><input id="publicRequestEmail" type="email" required autocomplete="email">
        <label>I am interested in</label><select id="publicRequestType" onchange="toggleRequestCourse()">
          <option value="contributor" ${requestType==='contributor'?'selected':''}>Contributing to Swaya</option>
          <option value="content_developer" ${requestType==='content_developer'?'selected':''}>Developing learning content</option>
          <option value="learner_access" ${requestType==='learner_access'?'selected':''}>Learner access to a course or resource</option>
        </select>
        <div id="requestCourseWrap"><label>Course or resource</label><select id="publicRequestCourse"><option value="">Not sure yet</option>${options}</select></div>
        <label>What would you like us to know?</label><textarea id="publicRequestMessage" rows="5" maxlength="3000" placeholder="Share your interest or describe the access you need."></textarea>
        <button>Send request</button><div id="publicRequestMsg" style="margin-top:12px" aria-live="polite"></div>
      </form>
    </section></main>`;
  toggleRequestCourse();
}

function toggleRequestCourse(){
  const wrap=$('#requestCourseWrap');
  if(wrap)wrap.classList.toggle('hidden',$('#publicRequestType').value!=='learner_access');
}

async function submitPublicRequest(event){
  event.preventDefault();
  const msg=$('#publicRequestMsg');msg.className='muted';msg.textContent='Sending…';
  try{
    const data=await api('/public/requests',{method:'POST',body:JSON.stringify({name:$('#publicRequestName').value,email:$('#publicRequestEmail').value,request_type:$('#publicRequestType').value,course_id:$('#publicRequestType').value==='learner_access'&&$('#publicRequestCourse').value?Number($('#publicRequestCourse').value):null,message:$('#publicRequestMessage').value})});
    msg.className=data.email_sent?'success':'warning';msg.textContent=data.message;
  }catch(e){msg.className='error';msg.textContent=e.message;}
}

async function adminMfaSetupPage(setupToken){
  adminMfaSetupToken=setupToken;
  try{
    const r=await fetch(API+'/auth/mfa/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setup_token:setupToken})});
    const data=await r.json();if(!r.ok)throw new Error(data.detail||'Could not start authenticator setup.');
    $('#app').innerHTML=`<div class="login-wrap"><section class="login-box"><h1>Secure your administrator account</h1><p>Scan this code with Google Authenticator, Microsoft Authenticator, or another TOTP authenticator app. If you cannot scan it, enter the setup key manually:</p><p style="text-align:center"><img src="${data.qr_data_uri}" alt="Authenticator setup QR code" width="190" height="190"></p><p class="card"><strong style="font-size:22px;letter-spacing:2px;word-break:break-all">${esc(data.secret)}</strong></p><p class="muted">Enter the six-digit code shown by your authenticator to finish setup. Keep the setup key private.</p><form onsubmit="enableAdminMfa(event)"><label>Authenticator code</label><input id="setupMfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button>Enable two-factor sign-in</button></form><div id="setupMfaMsg"></div></section></div>`;
  }catch(e){loginPage();$('#loginMsg').innerHTML='<p class="error">'+esc(e.message)+'</p>';}
}

async function enableAdminMfa(event){
  event.preventDefault();const msg=$('#setupMfaMsg');msg.textContent='Verifying…';
  try{
    const r=await fetch(API+'/auth/mfa/enable',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setup_token:adminMfaSetupToken,code:$('#setupMfaCode').value})});
    const data=await r.json();if(!r.ok)throw new Error(data.detail||'Could not verify the authenticator code.');
    localStorage.setItem('token',data.access_token);currentUser=data.user;historyStack=[];dashboard();
  }catch(e){msg.className='error';msg.textContent=e.message;}
}

async function login(e){
  e.preventDefault();

  $('#loginMsg').textContent='Signing in...';

  try{
    const body=JSON.stringify({email:document.querySelector("#loginEmail").value,password:document.querySelector("#loginPassword").value,mfa_code:$('#mfaCode').value||null});



    const r=await fetch(API+'/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body
    });

    const data=await r.json();

    if(!r.ok){
      if(data.detail==='Authenticator code required'){
        $('#mfaCodeLabel').classList.remove('hidden');
        $('#mfaCode').classList.remove('hidden');
        $('#mfaCode').focus();
      }
      throw new Error(data.detail||'Login failed');
    }

    if(data.mfa_setup_required){
      await adminMfaSetupPage(data.setup_token);
      return;
    }

    localStorage.setItem('token',data.access_token);
    currentUser=await api('/me');
    historyStack=[];
    dashboard();
  }catch(e){
    $('#loginMsg').innerHTML='<p class="error">'+esc(e.message)+'</p>';
  }
}

async function registerPage(){
  let courses=[];
  let courseError='';
  try{courses=await api('/public/courses');}catch(e){courseError=e.message;}
  $('#app').innerHTML=`
    <div class="login-wrap">
      <div class="login-box">
        <button class="secondary" onclick="loginPage()">&#8592; Login</button>
        <h1>Create Account</h1>

        <form onsubmit="register(event)">
          <label>Name</label>
          <input id="regName" autocomplete="name" required minlength="2" maxlength="120" placeholder="Your full name">
          <label>Email</label>
          <input id="regEmail" type="email" autocomplete="email" required>

          <label>Password</label>
          <input id="regPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="128" aria-describedby="regPasswordHelp">
          <small id="regPasswordHelp" class="muted">Use at least 10 characters.</small>

          <fieldset style="border:0;padding:0;margin:18px 0 10px">
            <legend style="font-weight:700;margin-bottom:4px">Choose your courses</legend>
            <p class="muted">Select one or more published courses to join.</p>
            ${courses.length?`<div class="course-choice-list">${courses.map(c=>`<label class="course-choice"><input type="checkbox" name="regCourse" value="${Number(c.id)}"><span><strong>${esc(c.title)}</strong><br><span class="muted">${esc(c.description||'Published learning path')}</span></span></label>`).join('')}</div>`:`<p class="${courseError?'error':'muted'}">${esc(courseError||'There are no published courses available to select right now.')}</p>`}
          </fieldset>

          <button style="width:100%">Register</button>
        </form>

        <div id="regMsg"></div>
        <p><button class="secondary" onclick="publicHome()">Explore Swaya</button></p>
      </div>
    </div>`;
}

async function register(e){
  e.preventDefault();

  const courseIds=[...document.querySelectorAll('input[name="regCourse"]:checked')].map(input=>Number(input.value));
  if(!courseIds.length){
    $('#regMsg').innerHTML='<p class="error">Select at least one published course before registering.</p>';
    return;
  }

  try{
    await api('/auth/register',{
      method:'POST',
      body:JSON.stringify({
        name:$('#regName').value,
        email:$('#regEmail').value,
        password:$('#regPassword').value,
        course_ids:courseIds
      })
    });

    $('#regMsg').innerHTML='<p class="success">Account created. Please login.</p>';
  }catch(e){
    $('#regMsg').innerHTML='<p class="error">'+esc(e.message)+'</p>';
  }
}

function shell(content){
  (window.mediaObjectUrls||[]).forEach(url=>URL.revokeObjectURL(url));
  window.mediaObjectUrls=[];
  const role=currentUser?.role||'learner';

  $('#app').innerHTML=`
    <div class="app">

      <aside class="sidebar">
        <h2 style="font-size:18px;line-height:1.2">Learning Pathway<br>to become what you want to be</h2>
        <p style="color:#98a2b3">${esc(currentUser?.email||'')}</p>

        <button onclick="publicHome()">&#127760; Public Home</button>
        <button onclick="dashboard()">&#127968; Dashboard</button>
        <button onclick="aboutPage()">&#8505; About Swaya</button>
        <button onclick="feedbackPage()">&#128172; Feedback</button>
        <button onclick="course()">&#128218; Course</button>
        <button onclick="spreadsheetLab()">&#128202; Spreadsheet Practice</button>
        <button onclick="sqlLab()">&#128221; SQL Practice</button>
        <button onclick="gamification()">&#128202; Progress</button>
        <button onclick="leaderboard()">&#127942; Leaderboard</button>
        <button onclick="certificate()">&#127941; Certificate</button>

        ${['instructor','admin','assessor'].includes(role)
          ? `<hr>
             <button onclick="instructor()">&#128188; Instructor</button>
             <button onclick="submissions()">&#128221; Submissions</button>`
          : ''}

        ${role==='admin'||role==='content_moderator'||role==='instructor'

async function loadMediaPreviews(items){
  const token=localStorage.getItem('token');
  for(const media of (items||[])){
    const target=document.getElementById('mediaPreview_'+media.id);
    if(!target) continue;
    try{
      const response=await fetch(API+'/media/'+media.id,{headers:{Authorization:'Bearer '+token}});
      if(!response.ok) throw new Error('Preview unavailable');
      const url=URL.createObjectURL(await response.blob());
      window.mediaObjectUrls.push(url);
      let preview='';
      if(media.media_kind==='video') preview=`<video controls preload="metadata" style="max-width:100%;max-height:480px" src="${url}"></video>`;
      else if(media.media_kind==='audio') preview=`<audio controls preload="metadata" style="width:100%" src="${url}"></audio>`;
      else if(media.media_kind==='image') preview=`<img alt="${esc(media.title)}" style="max-width:100%;max-height:480px" src="${url}">`;
      else if(media.media_kind==='pdf') preview=`<iframe title="${esc(media.title)}" style="width:100%;height:600px;border:0" src="${url}"></iframe>`;
      target.innerHTML=preview+`<p><a href="${url}" download="${esc(media.filename)}">Open or download ${esc(media.filename)}</a></p>`;
    }catch(e){
      target.textContent='Preview could not be loaded.';
    }
  }
}

function parseJSON(v){
  if(Array.isArray(v)) return v;
  try{return JSON.parse(v||'[]')}catch{return []}
}

function resourcesHtml(v){

  if(!r.length) return '<p class="muted">No resources added.</p>';

    if(typeof x==='string') return '<li>'+esc(x)+'</li>';
    return '<li><a href="'+esc(x.url||x.href||'#')+'" target="_blank">'+
           esc(x.title||x.name||x.url||'Resource')+'</a></li>';
  }).join('')+'</ul>';
}

function markdownToHtml(md){
  let s=esc(md);

  s=s.replace(/```([\\s\\S]*?)```/g,'<pre>$1</pre>');
  s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>');
  s=s.replace(/^## (.*)$/gm,'<h2>$1</h2>');
  s=s.replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s=s.replace(/\\*\\*(.*?)\\*\\*/g,'<strong>$1</strong>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\n\n/g,'</p><p>');
  s=s.replace(/\n/g,'<br>');

  return '<p>'+s+'</p>';
}

function pythonEditorKeydown(event){
  if(event.key!=='Tab')return;
  const editor=event.currentTarget;
  event.preventDefault();
  const start=editor.selectionStart;
  const end=editor.selectionEnd;
  const value=editor.value;
  const indent='    ';
  if(!event.shiftKey){
    const lineStart=value.lastIndexOf('\n',start-1)+1;
    const multiline=start!==end&&value.slice(start,end).includes('\n');
    if(multiline){
      const blockEnd=value.indexOf('\n',end);
      const replaceEnd=blockEnd<0?value.length:blockEnd;
      const block=value.slice(lineStart,replaceEnd);
      const changed=block.split('\n').map(line=>indent+line).join('\n');
      editor.value=value.slice(0,lineStart)+changed+value.slice(replaceEnd);
      editor.setSelectionRange(start+indent.length,end+indent.length*(block.split('\n').length));
    }else{
      editor.value=value.slice(0,start)+indent+value.slice(end);
      editor.setSelectionRange(start+indent.length,start+indent.length);
    }
    return;
  }
  const lineStart=value.lastIndexOf('\n',start-1)+1;
  const selectionEnd=value.indexOf('\n',end);
  const replaceEnd=selectionEnd<0?value.length:selectionEnd;
  const block=value.slice(lineStart,replaceEnd);
  let removedBeforeStart=0;
  let removedTotal=0;
  let offset=0;
  const changed=block.split('\n').map(line=>{
    const spaces=(line.match(/^ {1,4}/)||[''])[0].length;
    if(offset<start-lineStart)removedBeforeStart+=spaces;
    offset+=line.length+1;
    removedTotal+=spaces;
    return line.slice(spaces);
  }).join('\n');
  editor.value=value.slice(0,lineStart)+changed+value.slice(replaceEnd);
  editor.setSelectionRange(Math.max(lineStart,start-removedBeforeStart),Math.max(lineStart,end-removedTotal));
}

function spreadsheetAddress(row,col){let label='';for(col++;col;col=Math.floor((col-1)/26))label=String.fromCharCode(65+(col-1)%26)+label;return label+(row+1)}

  if(tokens.join('')!==text.replace(/\s/g,''))throw Error('Check the formula syntax.');
  return tokens;
}
function spreadsheetValue(address,stack=new Set()){
  if(stack.has(address))throw Error('Circular reference');
  const raw=String(spreadsheetCells[address]??'').trim();
  if(!raw)return 0;
  if(!raw.startsWith('=')){const n=Number(raw);return Number.isFinite(n)&&raw!==''?n:raw}
  const next=new Set(stack);next.add(address);const tokens=spreadsheetTokens(raw);let i=0;

async function openSubmissionFile(id){
  try{
    const token=localStorage.getItem('token');
    const response=await fetch('/api/instructor/submissions/'+id+'/file',{
      headers:{'Authorization':'Bearer '+token}
    });

    if(!response.ok){
      const msg=await response.text();
      throw new Error(msg||'Unable to open uploaded file');
    }

    const blob=await response.blob();
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank');

    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){
    alert('Unable to open uploaded file: '+e.message);
  }
}

async function saveEvaluation(id){
  const scoreInput=document.querySelector('#evaluationScore');
  const feedbackInput=document.querySelector('#evaluationFeedback');
  const result=document.querySelector('#evaluationResult');

  const score=Number(scoreInput?.value);
  const feedback=(feedbackInput?.value||'').trim();

  if(!Number.isFinite(score) || score<0 || score>100){
    result.innerHTML='<p class="error">Please enter a score between 0 and 100.</p>';
    return;
  }

  result.innerHTML='<p class="muted">Saving evaluation...</p>';

  try{
    await api('/instructor/submissions/'+id,{
      method:'PATCH',
      body:JSON.stringify({
        score:score,
        feedback:feedback
      })
    });

    result.innerHTML='<p class="success">Evaluation submitted successfully.</p>';

  }catch(e){
    result.innerHTML='<p class="error">'+esc(e.message)+'</p>';
  }
}

function downloadLessonCsvTemplate(){
  const csv='day_number,title,goal,content_md,content_html,content_css,estimated_minutes,status\r\n1,Introduction,Explain the learning outcome,Write lesson text in Markdown,\"<h2>Lesson heading</h2><p>HTML notes go here.</p>\",,60,draft\r\n';
  const blob=new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download='swaya-daywise-lessons-template.csv';
  link.click();
  URL.revokeObjectURL(url);
}

async function bulkUploadLessons(courseId){
  const input=$('#bulkLessonsFile');
  const message=$('#bulkLessonsMessage');
  const file=input?.files?.[0];
  if(!file||!message)return;
  message.className='muted';
  message.textContent='Uploading and checking all lesson rows…';
  const body=new FormData();
  body.append('file',file);
  try{
    const result=await api(`/admin/courses/${courseId}/lessons/bulk`,{method:'POST',body});
    message.className='success';
    message.textContent=`Added ${result.created} lessons for days ${result.days.join(', ')}.`;
    await loadCourseLessons();
    const refreshed=$('#bulkLessonsMessage');
    if(refreshed){refreshed.className='success';refreshed.textContent=message.textContent;}
  }catch(e){
    message.className='error';
    message.textContent=e.message;
  }finally{
    input.value='';
  }
}

async function saveNewLesson(courseId){
  const day=Number($('#newLessonDay').value);
  const title=$('#newLessonTitle').value.trim();
  const goal=$('#newLessonGoal').value.trim();
  const content_md=$('#newLessonContent').value;
  const htmlCssSource=$('#newLessonHtmlCss').value||'';
  const content_html=htmlCssSource.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,'').trim();
  const content_css=[...htmlCssSource.matchAll(/<style\b[^>]*>([\s\S]*?)<\/style>/gi)]
    .map(match=>match[1].trim())
    .filter(Boolean)
    .join('\n\n');
  const estimated_minutes=Number($('#newLessonMinutes').value)||60;

  if(!day){
    alert('Please enter the day number.');
    return;
  }

  if(!title){
    alert('Please enter the lesson title.');
    return;
  }

  try{
    const result=await api(
      '/admin/lessons?course_id='+encodeURIComponent(courseId),
      {
        method:'POST',
        body:JSON.stringify({
          day_number:day,
          title:title,
          goal:goal,
          content_md:content_md,
          content_html:content_html,
          content_css:content_css,
          objectives:[],
          resources:[],
          status:'published',
          estimated_minutes:estimated_minutes
        })
      }
    );

    alert('Lesson created successfully. Lesson Code: '+(result.lesson_code||result.id));
    manageLessons();
  }catch(e){
    alert(e.message);
  }
}

function downloadQuestionTemplate(format){
  const headers=['course_code','lesson_code','day_number','question','option_a','option_b','option_c','option_d','correct_answer','explanation','resource_url','difficulty','topic','tags','active'];
  if(format==='xlsx'){
    fetch(API+'/admin/questions/template.xlsx',{headers:{Authorization:'Bearer '+localStorage.getItem('token')}}).then(async r=>{if(!r.ok)throw new Error('Unable to download Excel template.');const blob=await r.blob();const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='swaya-question-bank-template.xlsx';link.click();URL.revokeObjectURL(link.href);}).catch(e=>alert(e.message));return;
  }
  const example=['3DDE','','1','Which format can identify a lesson?','Course code + day','Course title only','Email address','Question ID','A','Use course_code and either lesson_code or day_number.','','medium','Sample','template;example','true'];
  const delimiter=format==='txt'?'\t':',';
  const content=[headers,example].map(row=>row.map(v=>format==='txt'?v:'"'+String(v).replaceAll('"','""')+'"').join(delimiter)).join('\r\n');
  const blob=new Blob(['\ufeff',content],{type:format==='txt'?'text/plain;charset=utf-8':'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`swaya-question-bank-template.${format}`;link.click();URL.revokeObjectURL(link.href);
}

  }
  try{
    const payload={name,email,role};
    if(password) payload.password=password;
    await api('/admin/users/'+id,{
      method:'PATCH',
      body:JSON.stringify(payload)
    });
    if(role==='learner'){
      const selectedIds=[...document.querySelectorAll('input[name="editUserCourse"]:checked')].map(x=>Number(x.value));
      const currentIds=window.editUserActiveCourseIds||[];
      for(const courseId of selectedIds){
        if(!currentIds.includes(courseId)) await api('/admin/users/'+id+'/courses/'+courseId,{method:'POST'});
      }
      for(const courseId of currentIds){
        if(!selectedIds.includes(courseId)) await api('/admin/users/'+id+'/courses/'+courseId,{method:'DELETE'});
      }
    }
    adminUsers();
  }catch(e){
    alert(e.message);
  }
}

  try{
    const logs=await api('/admin/audit-logs');

      <h1>&#128196; Audit Logs</h1>

      <div class="card" style="overflow:auto">
        <table>
          <tr>

            <th>User</th>
            <th>Action</th>
            <th>Created</th>
          </tr>

          ${(logs||[]).map(x=>`
            <tr>
              <td>${esc(x.id)}</td>
              <td>${esc(x.user_id||'-')}</td>
              <td>${esc(x.action||x.event||'-')}</td>
              <td>${esc(x.created_at||'-')}</td>
            </tr>`).join('')}
        </table>
      </div>
    `);
  }catch(e){
    shell(`<h1>Audit Logs</h1><div class="card"><p class="error">${esc(e.message)}</p></div>`);
  }
}

async function adminRequests(){
  pushPage(adminRequests);
  try{
    const requests=await api('/admin/public-requests');
    shell(`<div class="nav-row">${backButton()}</div><h1>Public Requests</h1>
      <div class="card" style="overflow:auto"><table><tr><th>Received</th><th>Request</th><th>Contact</th><th>Course/resource</th><th>Message</th><th>Status</th></tr>
      ${(requests||[]).map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.request_type.replaceAll('_',' '))}</td><td>${esc(x.name)}<br><a href="mailto:${encodeURIComponent(x.email)}">${esc(x.email)}</a></td><td>${esc(x.course||'—')}</td><td style="white-space:pre-wrap;min-width:220px">${esc(x.message||'—')}</td><td><select aria-label="Request status" onchange="setPublicRequestStatus(${x.id},this.value)">${['new','reviewed','approved','declined'].map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6">No requests have arrived yet.</td></tr>'}
      </table></div>`);
  }catch(e){shell(`<div class="card"><h1>Public Requests</h1><p class="error">${esc(e.message)}</p></div>`);}
}

async function adminFeedback(){
  pushPage(adminFeedback);
  try{
    const items=await api('/admin/feedback');
    shell(`<div class="nav-row">${backButton()}</div><h1>Feedback</h1><div class="card" style="overflow:auto"><table><tr><th>Received</th><th>From</th><th>Message</th><th>Screenshot</th></tr>
      ${(items||[]).map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.name)}<br><a href="mailto:${encodeURIComponent(x.email)}">${esc(x.email)}</a></td><td style="white-space:pre-wrap;min-width:260px">${esc(x.message)}</td><td>${x.screenshot?`<button class="secondary" onclick="openFeedbackScreenshot(${x.id})">Open screenshot</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="4">No feedback received yet.</td></tr>'}
      </table></div>`);
  }catch(e){shell(`<div class="card"><h1>Feedback</h1><p class="error">${esc(e.message)}</p></div>`);}
}

async function openFeedbackScreenshot(id){
  try{const response=await fetch(API+'/admin/feedback/'+id+'/screenshot',{headers:{Authorization:'Bearer '+localStorage.getItem('token')}});if(!response.ok)throw new Error('Unable to open screenshot.');const url=URL.createObjectURL(await response.blob());window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);}
  catch(e){alert(e.message);}
}

async function setPublicRequestStatus(id,status){
  try{await api('/admin/public-requests/'+id,{method:'PATCH',body:JSON.stringify({status})});}
  catch(e){alert(e.message);adminRequests();}
}

start();
</script>
